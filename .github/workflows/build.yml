name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  assets:
    name: Validate assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate models, textures, lang and data
        run: python3 tools/validate_assets.py

  build:
    name: Compile and package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: selarium-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: GameTests (headless server)
        run: ./gradlew runGameTestServer --no-daemon --stacktrace
      - name: Check server log
        if: always()
        run: |
          python3 tools/check_server_log.py run/logs/latest.log
          echo "----- tail -----"
          tail -25 run/logs/latest.log || true
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: run/logs/
          if-no-files-found: ignore
