plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.53'
}

version = '0.3.0'
group = 'com.seleris.selarium'

base {
    archivesName = 'selarium'
}

if (providers.gradleProperty('selariumBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('selariumBuildDir').get())
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory providers.gradleProperty('selariumRunDir').isPresent()
                    ? file(providers.gradleProperty('selariumRunDir').get()) : project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                selarium {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'selarium'

            // CI: ./gradlew runClient -Psmoketest boots the game, builds a showcase and takes screenshots
            // (see ClientSmokeTest); it is inert without the flag.
            if (providers.gradleProperty('smoketest').isPresent()) {
                property 'selarium.smoketest', 'true'
                property 'forge.logging.console.level', 'info'
                jvmArgs '-Xmx2G'
                args '--width', '854', '--height', '480'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'selarium'
            args '--nogui'
        }

        // Headless server that runs every registered GameTest and exits (used by CI).
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'selarium'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    // the CI client driver is only ever run from the build's class directories, never shipped
    exclude 'com/seleris/selarium/client/dev/**'
    manifest {
        attributes([
                'Specification-Title'     : 'selarium',
                'Specification-Vendor'    : 'Seleris',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Seleris',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
